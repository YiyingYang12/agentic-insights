name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue the latest publication without interrupting a deployment in progress.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Leave room for setup and cleanup around Pages' own 10-minute deployment cap.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the public site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # This is the artifact build time, not a promise of deployment completion.
      # Keep runtime-only metadata out of Git so unchanged syncs remain unchanged.
      - name: Stamp the public build
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          path = Path('site/publication.json')
          publication = json.loads(path.read_text())
          publication['builtAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          publication['commitSha'] = os.environ['GITHUB_SHA']
          path.write_text(json.dumps(publication, indent=2) + '\n')
          PY

      - name: Upload the public site only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
